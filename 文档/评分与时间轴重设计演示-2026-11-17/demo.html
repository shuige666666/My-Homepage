        else filteredReviews = reviews.slice();
        if (flipEndTimer) { clearTimeout(flipEndTimer); flipEndTimer = 0; }
        if (tiltRaf) { cancelAnimationFrame(tiltRaf); tiltRaf = 0; }
        activeReviewIndex = 0; isCardFlipped = false; isCardFlipping = false;
        tiltTargetX = 0; tiltTargetY = 0; tiltCurrX = 0; tiltCurrY = 0; hoverTarget = 0; hoverCurr = 0; dragDx = 0;
        deckZone.classList.remove("is-deck-hovered");
        renderDeck(true, 0); renderFolioCopy(false); syncProxyImage();
      }

      function deckRestingPose(offset) {
        if (offset === 0) return { x: 0, y: 0, rot: 0, scale: 1, opacity: 1 };
        if (offset === 1) return { x: -28, y: -8, rot: -5.2, scale: 0.945, opacity: 0.96 };
        if (offset === 2) return { x: -54, y: -15, rot: -10.2, scale: 0.89, opacity: 0.88 };
        if (offset === 3) return { x: -76, y: -20, rot: -14.5, scale: 0.835, opacity: 0.74 };
        return { x: 140, y: -18, rot: 12, scale: 0.92, opacity: 0 };
      }

      function createTicketCard(item, idx, offset) {
        const card = document.createElement("div");
        card.className = "ticket-card";
        if (offset === 0 && isCardFlipped) card.classList.add("is-flipped");
        card.dataset.offset = String(offset);
        const bgm = item.bangumiScore ? item.bangumiScore.toFixed(1) : "暂无";
        const diff = item.bangumiScore ? (item.userScore - item.bangumiScore) : null;
        const diffStr = diff === null ? "—" : diff > 0.05 ? `+${diff.toFixed(1)}` : diff < -0.05 ? `${diff.toFixed(1)}` : "0.0";
        card.innerHTML = `

                <div class="postcard-stamp"><div>${item.userScore.toFixed(1)}<span>SCORE</span></div></div>
              </div>
              <div class="postcard-titles"><h4>${escapeHtml(item.nameCn || item.name)}</h4><p>${escapeHtml(item.name)}</p></div>
              <dl class="postcard-specs">
                <div><dt>我的评分</dt><dd>${item.userScore.toFixed(1)} / 10</dd></div>

              <div class="postcard-foot"><span>点击翻回封面</span><a class="postcard-bgm-link" href="${escapeHtml(item.url)}" target="_blank" rel="noreferrer">Bangumi ↗</a></div>
            </div>
          </div>`;

      function applyCardTransforms(animateFlag) {

          if (offset === 0) {
            x += dragDx; y -= Math.abs(dragDx) * 0.05; rot += dragDx * 0.045;
            scale += 0.044 * hExpand;
            if (!isDraggingDeck && !isCardFlipped && (tiltCurrX !== 0 || tiltCurrY !== 0)) {
              card.style.setProperty("--tilt-x", `${tiltCurrX.toFixed(2)}deg`);
              card.style.setProperty("--tilt-y", `${tiltCurrY.toFixed(2)}deg`);
            } else {
              card.style.setProperty("--tilt-x", "0deg");
              card.style.setProperty("--tilt-y", "0deg");
            }
          } else if (offset > 0) {
            const nextPose = deckRestingPose(offset - 1);
            x += (nextPose.x - pose.x) * dragProgress - tiltCurrY * offset * 0.14;
            y += (nextPose.y - pose.y) * dragProgress + tiltCurrX * offset * 0.12;
            rot += (nextPose.rot - pose.rot) * dragProgress;
            scale += (nextPose.scale - pose.scale) * dragProgress;
            // Shift rear stack proportionally outward & match subtle scale so exposed area stays unchanged on front zoom
            x -= (3.2 + (offset - 1) * 1.4) * hExpand;
            y -= (2.8 + (offset - 1) * 1.0) * hExpand;
            rot -= offset * 0.45 * hExpand;
            scale += 0.026 * hExpand;
            // Tuck rear cards behind front card as handoff starts
            x *= (1 - gather);
            y *= (1 - gather);
            rot *= (1 - gather);
            opacity *= (1 - gather);
          }

          card.style.transition = (isDraggingDeck || !animateFlag || gather > 0 || hExpand > 0.002) ? "none" : "transform 460ms var(--ease), opacity 360ms ease";
          card.style.opacity = String(opacity.toFixed(3));
          if (offset === 0 && !isDraggingDeck && Math.abs(x) < 0.05 && Math.abs(y) < 0.05 && Math.abs(rot) < 0.02 && Math.abs(scale - 1) < 0.001) {
            card.style.transform = "none";
          } else {
            card.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0) rotateZ(${rot.toFixed(2)}deg) scale(${scale.toFixed(3)})`;
          }
        });
      }

      function renderDeck(animateFlag = true, enterDir = 0) {
        const n = filteredReviews.length;
        deckOrbit.innerHTML = "";
        if (!n) return;
        const visibleOffsets = Math.min(4, n);
        for (let off = visibleOffsets - 1; off >= 0; off--) {
          const idx = (activeReviewIndex + off) % n;
          const card = createTicketCard(filteredReviews[idx], idx, off);
          if (off === 0) bindFrontCardInteractions(card);
          deckOrbit.appendChild(card);
        }
        if (enterDir !== 0 && !reducedMotion.matches) {
          Array.from(deckOrbit.querySelectorAll(".ticket-card")).forEach((card) => {
            const off = Number(card.dataset.offset);
            const fromPose = (off === 0 && enterDir < 0) ? { x: -175, y: -14, rot: -10, scale: 0.94, opacity: 0.25 } : deckRestingPose(Math.min(3, off + (enterDir > 0 ? 1 : 0)));
            card.style.transition = "none"; card.style.opacity = String(fromPose.opacity);
            card.style.transform = `translate3d(${fromPose.x}px, ${fromPose.y}px, 0) rotateZ(${fromPose.rot}deg) scale(${fromPose.scale})`;
          });
          void deckOrbit.offsetWidth;
          requestAnimationFrame(() => applyCardTransforms(true));
        } else {
          applyCardTransforms(animateFlag);
        }
      }

      function stepReview(dir) {
        const n = filteredReviews.length;
        if (n <= 1) return;
        const outgoing = deckOrbit.querySelector('.ticket-card[data-offset="0"]');
        if (outgoing && !reducedMotion.matches && dir > 0) {
          outgoing.animate([
            { transform: outgoing.style.transform === "none" ? "translate3d(0,0,0)" : outgoing.style.transform, opacity: 1 },
            { transform: `translate3d(-240px, -24px, 0) rotateZ(-16deg) scale(0.94)`, opacity: 0 },
          ], { duration: 220, easing: "cubic-bezier(0.22, 1, 0.36, 1)", fill: "forwards" });
        }
        if (flipEndTimer) { clearTimeout(flipEndTimer); flipEndTimer = 0; }
        if (tiltRaf) { cancelAnimationFrame(tiltRaf); tiltRaf = 0; }
        activeReviewIndex = (activeReviewIndex + dir + n) % n;
        isCardFlipped = false; isCardFlipping = false;
        tiltTargetX = 0; tiltTargetY = 0; tiltCurrX = 0; tiltCurrY = 0; hoverTarget = 0; hoverCurr = 0; dragDx = 0;
        deckZone.classList.remove("is-deck-hovered");
        window.setTimeout(() => { renderDeck(true, dir); renderFolioCopy(true); syncProxyImage(); }, reducedMotion.matches || dir < 0 ? 0 : 110);
      }

      function jumpToReview(targetIdx) {
        if (targetIdx === activeReviewIndex) return;
        if (flipEndTimer) { clearTimeout(flipEndTimer); flipEndTimer = 0; }
        if (tiltRaf) { cancelAnimationFrame(tiltRaf); tiltRaf = 0; }
        const n = filteredReviews.length;
        const chosenDir = ((targetIdx - activeReviewIndex + n) % n) <= n / 2 ? 1 : -1;
        activeReviewIndex = targetIdx; isCardFlipped = false; isCardFlipping = false;
        tiltTargetX = 0; tiltTargetY = 0; tiltCurrX = 0; tiltCurrY = 0; hoverTarget = 0; hoverCurr = 0; dragDx = 0;
        deckZone.classList.remove("is-deck-hovered");
        renderDeck(true, chosenDir); renderFolioCopy(true); syncProxyImage();
      }

      function toggleFrontCardFlip() {
        const front = deckOrbit.querySelector('.ticket-card[data-offset="0"]');
        if (!front) return;
        const flipper = front.querySelector(".ticket-flipper");
        if (flipEndTimer) { clearTimeout(flipEndTimer); flipEndTimer = 0; }
        if (tiltRaf) { cancelAnimationFrame(tiltRaf); tiltRaf = 0; }
        isCardFlipped = !isCardFlipped;
        isCardFlipping = true;
        tiltTargetX = 0; tiltTargetY = 0; tiltCurrX = 0; tiltCurrY = 0;
        hoverTarget = 0; hoverCurr = 0;
        front.classList.remove("is-tilting", "is-hovered");
        deckZone.classList.remove("is-deck-hovered");
        front.classList.add("is-flipping");
        applyCardTransforms(false);
        if (flipper) void flipper.offsetWidth;
        front.classList.toggle("is-flipped", isCardFlipped);
        if (reducedMotion.matches) {
          isCardFlipping = false;
          front.classList.remove("is-flipping");
          return;
        }
        flipEndTimer = window.setTimeout(() => {
          flipEndTimer = 0;
          isCardFlipping = false;
          front.classList.remove("is-flipping");
        }, 680);
      }

      function startTiltLoop() {
        if (tiltRaf || reducedMotion.matches) return;
        const tick = () => {
          tiltCurrX += (tiltTargetX - tiltCurrX) * 0.16;
          tiltCurrY += (tiltTargetY - tiltCurrY) * 0.16;
          hoverCurr += (hoverTarget - hoverCurr) * 0.18;
          if (!isDraggingDeck) applyCardTransforms(false);
          const stillMoving = Math.abs(tiltTargetX - tiltCurrX) > 0.04 || Math.abs(tiltTargetY - tiltCurrY) > 0.04 || Math.abs(hoverTarget - hoverCurr) > 0.008;
          if (stillMoving) tiltRaf = requestAnimationFrame(tick);
          else {
            tiltCurrX = tiltTargetX; tiltCurrY = tiltTargetY; hoverCurr = hoverTarget;
            applyCardTransforms(false);
            if (tiltCurrX === 0 && tiltCurrY === 0 && hoverCurr === 0) deckOrbit.querySelector('.ticket-card[data-offset="0"]')?.classList.remove("is-tilting");
            tiltRaf = 0;
          }
        };
        tiltRaf = requestAnimationFrame(tick);
      }

      function bindFrontCardInteractions(card) {
        card.querySelector(".postcard-bgm-link")?.addEventListener("click", (e) => e.stopPropagation());
        card.addEventListener("pointerenter", () => {
          if (isDraggingDeck || isCardFlipped || isCardFlipping) return;
          hoverTarget = 1;
          card.classList.add("is-hovered");
          deckZone.classList.add("is-deck-hovered");
          if (reducedMotion.matches) { hoverCurr = 1; applyCardTransforms(false); }
          else startTiltLoop();
        });
        card.addEventListener("pointermove", (e) => {
          if (isDraggingDeck || isCardFlipped || isCardFlipping || reducedMotion.matches) return;
          hoverTarget = 1;
          card.classList.add("is-tilting", "is-hovered");
          deckZone.classList.add("is-deck-hovered");
          const rect = card.getBoundingClientRect();
          tiltTargetX = (0.5 - (e.clientY - rect.top) / rect.height) * 9;
          tiltTargetY = ((e.clientX - rect.left) / rect.width - 0.5) * 11;
          startTiltLoop();
        });
        card.addEventListener("pointerleave", () => {
          if (isDraggingDeck || isCardFlipping || isCardFlipped) return;
          tiltTargetX = 0; tiltTargetY = 0; hoverTarget = 0;
          card.classList.remove("is-hovered");
          deckZone.classList.remove("is-deck-hovered");
          if (reducedMotion.matches) { hoverCurr = 0; applyCardTransforms(false); }
          else startTiltLoop();
        });
        card.addEventListener("pointerdown", (e) => {
          if (e.target.closest("a, button")) return;
          const startX = e.clientX, startY = e.clientY;
          let moved = false, lastX = startX, lastT = performance.now(), vx = 0;
          card.setPointerCapture(e.pointerId);
          const onMove = (ev) => {
            const dx = ev.clientX - startX, dy = ev.clientY - startY;
            if (!moved && Math.hypot(dx, dy) > 7) { moved = true; isDraggingDeck = true; card.classList.add("is-dragging"); revSection.classList.add("is-travelling"); }
            if (!moved) return;
            const now = performance.now(); vx = (ev.clientX - lastX) / Math.max(8, now - lastT);
            lastX = ev.clientX; lastT = now; dragDx = dx; applyCardTransforms(false);
          };
          const onUp = () => {
            card.removeEventListener("pointermove", onMove); card.removeEventListener("pointerup", onUp); card.removeEventListener("pointercancel", onUp);
            card.classList.remove("is-dragging"); revSection.classList.remove("is-travelling"); isDraggingDeck = false;
            if (!moved) { toggleFrontCardFlip(); return; }
            const flingScore = dragDx + vx * 160;
            if (Math.abs(flingScore) > 85 && filteredReviews.length > 1) stepReview(flingScore < 0 ? 1 : -1);
            else { dragDx = 0; applyCardTransforms(true); }
          };
          card.addEventListener("pointermove", onMove); card.addEventListener("pointerup", onUp); card.addEventListener("pointercancel", onUp);
        });
      }

      function renderFolioCopy(animateFlag = true) {
        const item = filteredReviews[activeReviewIndex];
        if (!item) return;
        folioCounter.innerHTML = `<strong>${String(activeReviewIndex + 1).padStart(2, "0")}</strong> / ${filteredReviews.length}`;
        folioDate.textContent = fmtDate(item.updatedAt);
        folioRankInfo.textContent = item.bangumiScore ? `BGM ${item.bangumiScore.toFixed(1)}${item.rank ? ` · #${item.rank}` : ""}` : "暂无均分";
        folioTitle.textContent = item.nameCn || item.name;
        folioNative.textContent = item.nameCn && item.name !== item.nameCn ? item.name : "";
        folioScore.textContent = item.userScore.toFixed(1);
        folioBgmLink.href = item.url;
        folioRulerFill.style.width = `${Math.max(0, Math.min(100, item.userScore * 10))}%`;
        if (item.bangumiScore) {
          folioRulerBgm.hidden = false; folioRulerBgm.style.left = `${item.bangumiScore * 10}%`;
          const delta = item.userScore - item.bangumiScore;
          folioDeltaText.textContent = `${item.bangumiScore.toFixed(1)} (${delta >= 0 ? "+" : ""}${delta.toFixed(1)})`;
        } else { folioRulerBgm.hidden = true; folioDeltaText.textContent = "暂无"; }
        folioProse.innerHTML = formatProseHtml(item.comment);
        if (animateFlag && !reducedMotion.matches) {
          folioCopy.classList.remove("is-entering"); scoreBrush.classList.remove("is-drawing");
          void folioCopy.offsetWidth;
          folioCopy.classList.add("is-entering"); scoreBrush.classList.add("is-drawing");
        }
      }

      filterButtons.forEach((btn) => btn.addEventListener("click", () => applyReviewFilter(btn.dataset.filter)));
      document.getElementById("review-prev-btn").addEventListener("click", () => stepReview(-1));
      document.getElementById("review-next-btn").addEventListener("click", () => stepReview(1));
      deckZone.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") { e.preventDefault(); stepReview(1); }
        else if (e.key === "ArrowLeft") { e.preventDefault(); stepReview(-1); }
        else if (e.key === " ") { e.preventDefault(); toggleFrontCardFlip(); }
      });

      /* ARCHIVE DRAWER */
      const archiveDrawer = document.getElementById("archive-drawer");
      const archiveGrid = document.getElementById("archive-grid");
      const archiveSearch = document.getElementById("archive-search");
      const archiveSort = document.getElementById("archive-sort");
      const archiveTierChips = Array.from(document.querySelectorAll("#archive-tier-chips .archive-chip"));
      let archiveTier = "all";

      function renderArchiveGrid() {
        const query = archiveSearch.value.trim().toLowerCase();
        const sortBy = archiveSort.value;
        const list = reviews.filter((r) => {
          if (archiveTier === "9-10" && r.userScore < 9) return false;
          if (archiveTier === "7-8" && (r.userScore < 7 || r.userScore >= 9)) return false;
          if (archiveTier === "0-6" && r.userScore >= 7) return false;
          if (archiveTier === "commented" && !(r.comment || "").trim()) return false;
          if (query && !`${r.nameCn} ${r.name} ${r.comment}`.toLowerCase().includes(query)) return false;
          return true;
        });
        if (sortBy === "score-desc") list.sort((a, b) => b.userScore - a.userScore || b.updatedAt.localeCompare(a.updatedAt));
        else if (sortBy === "score-asc") list.sort((a, b) => a.userScore - b.userScore || b.updatedAt.localeCompare(a.updatedAt));
        else if (sortBy === "diff-desc") list.sort((a, b) => (b.bangumiScore ? Math.abs(b.userScore - b.bangumiScore) : -1) - (a.bangumiScore ? Math.abs(a.userScore - a.bangumiScore) : -1));
        archiveGrid.innerHTML = "";
        if (!list.length) { archiveGrid.innerHTML = `<p style="color:var(--muted);padding:24px 0">没有找到符合条件的记录。</p>`; return; }
        list.forEach((item, idx) => {
          const card = document.createElement("button"); card.type = "button"; card.className = "archive-ticket";
          card.style.setProperty("--tilt", `${((idx % 5) - 2) * 0.4}deg`);
          const excerpt = (item.comment || "").replace(/\s+/g, " ").trim();
          card.innerHTML = `<img src="${thumbSrc(item)}" alt="" loading="lazy" /><div class="archive-ticket-body"><div class="archive-ticket-meta"><span>${item.updatedAt ? item.updatedAt.slice(0, 10) : "未知"}</span><span class="archive-ticket-score">★ ${item.userScore.toFixed(1)}</span></div><h4>${escapeHtml(item.nameCn || item.name)}</h4><p class="archive-ticket-excerpt">${escapeHtml(excerpt || "暂无短评。")}</p></div>`;
          card.addEventListener("click", () => {
            archiveDrawer.hidden = true; applyReviewFilter("all");
            const idxInAll = filteredReviews.findIndex((r) => r.id === item.id);
            if (idxInAll >= 0) jumpToReview(idxInAll);
            window.scrollTo({ top: 0, behavior: reducedMotion.matches ? "auto" : "smooth" });
          });
          archiveGrid.appendChild(card);
        });
      }
      document.getElementById("open-archive-btn").addEventListener("click", () => { renderArchiveGrid(); archiveDrawer.hidden = false; archiveSearch.focus(); });
      document.getElementById("close-archive-btn").addEventListener("click", () => { archiveDrawer.hidden = true; });
      archiveSearch.addEventListener("input", renderArchiveGrid);
      archiveSort.addEventListener("change", renderArchiveGrid);
      archiveTierChips.forEach((chip) => chip.addEventListener("click", () => {
        archiveTier = chip.dataset.tier;
        archiveTierChips.forEach((c) => c.setAttribute("aria-pressed", String(c === chip)));
        renderArchiveGrid();
      }));
      window.addEventListener("keydown", (e) => { if (e.key === "Escape" && !archiveDrawer.hidden) archiveDrawer.hidden = true; });

      /* SECTION 02 */
      const dates = watchHistory.map((e) => new Date(e.updatedAt)).filter((d) => !Number.isNaN(d.getTime()));
      const minDate = new Date(Math.min(...dates.map((d) => d.getTime())));
      const maxDate = new Date(Math.max(...dates.map((d) => d.getTime()), new Date("2026-11-01").getTime()));
      const startM = new Date(minDate.getFullYear(), minDate.getMonth(), 1);
      const endM = new Date(maxDate.getFullYear(), maxDate.getMonth(), 1);
      const totalMonths = (endM.getFullYear() - startM.getFullYear()) * 12 + (endM.getMonth() - startM.getMonth()) + 1;

      const months = Array.from({ length: totalMonths }, (_, i) => {
        const d = new Date(startM.getFullYear(), startM.getMonth() + i, 1);
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
        const entries = watchHistory.filter((e) => e.updatedAt && e.updatedAt.startsWith(key)).sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));
        return { index: i, key, year: d.getFullYear(), monthNum: d.getMonth() + 1, shortLabel: `${d.getMonth() + 1}月`, entries };
      });

      const tlSection = document.getElementById("section-timeline");
      const timelineTop = document.getElementById("timeline-top");
      const timelineCopy = document.getElementById("timeline-copy");
      const polaroidStage = document.getElementById("polaroid-stage");
      const polaroidRing = document.getElementById("polaroid-ring");
      const polaroidDeck = document.getElementById("polaroid-deck");
      const polaroidSleeve = document.getElementById("polaroid-sleeve");
      const sleeveYear = document.getElementById("sleeve-year");
      const odoTens = document.getElementById("odo-tens");
      const odoOnes = document.getElementById("odo-ones");
      const tlYearLabel = document.getElementById("tl-year-label");
      const tlCountLine = document.getElementById("tl-count-line");
      const contactList = document.getElementById("contact-sheet-list");
      const rangeButtons = Array.from(document.querySelectorAll("#tl-range-group .range-btn"));
      const rangeThumb = document.getElementById("tl-range-thumb");
      const rulerInstrument = document.getElementById("ruler-instrument");
      const rulerScroll = document.getElementById("ruler-scroll");
      const rulerCanvas = document.getElementById("ruler-canvas");
      const rulerSvg = document.getElementById("ruler-svg");
      const rulerCols = document.getElementById("ruler-cols");
      const rulerLoupe = document.getElementById("ruler-loupe");
      const rulerLoupeLine = document.getElementById("ruler-loupe-line");
      const rulerCaption = document.getElementById("ruler-range-caption");

      let tlRange = "12";
      let visibleMonths = months.slice(-12);
      let activeMonthKey = ([...months].reverse().find((m) => m.entries.length) || months[months.length - 1]).key;
      let frontOrderOffset = 0, fanSpreadBias = 0, scrollFanFactor = 1, hoveredAnimeId = null;

      function getMonthObj(key) { return months.find((m) => m.key === key) || months[months.length - 1]; }
      function jumpToReviewSubject(subjectId) {
        const rev = reviewById.get(subjectId);
        if (!rev) return false;
        applyReviewFilter("all");
        const idx = filteredReviews.findIndex((r) => r.id === subjectId);
        if (idx >= 0) jumpToReview(idx);
        window.scrollTo({ top: 0, behavior: reducedMotion.matches ? "auto" : "smooth" });
        return true;
      }

      function polaroidPose(slotIdx, total, spreadBias, fanOpen) {
        if (total === 1) return { x: spreadBias * 8, y: -4, angle: (-2.5 + spreadBias * 2) * fanOpen, scale: 1.02, z: 20 };
        if (slotIdx === 0) return { x: spreadBias * 10, y: 2, angle: -2 + spreadBias * 3, scale: 1.02, z: 20 };
        const side = slotIdx % 2 === 1 ? 1 : -1;
        const tier = Math.ceil(slotIdx / 2);
        const maxTier = Math.max(1, Math.ceil((total - 1) / 2));
        const u = tier / maxTier;
        const easeU = Math.pow(u, 0.88);
        const maxX = total <= 3 ? 42 : total <= 5 ? 66 : 78;
        const maxAngle = total <= 3 ? 10.5 : total <= 5 ? 15.5 : 18.5;
        const maxDrop = total <= 3 ? 4 : total <= 5 ? 9 : 13;
        const spreadFactor = (1 + Math.abs(spreadBias) * 0.16) * fanOpen;
        return {
          x: side * easeU * maxX * spreadFactor + spreadBias * easeU * 14,
          y: (2 + Math.pow(u, 1.35) * maxDrop) * fanOpen - Math.abs(spreadBias) * 2,
          angle: (side * easeU * maxAngle + spreadBias * 2.2) * fanOpen,
          scale: Math.max(0.86, 0.97 - easeU * 0.11),
          z: Math.max(1, 20 - slotIdx),
        };
      }

      function applyPolaroidPositions(animateCards = true) {
        const cards = Array.from(polaroidDeck.querySelectorAll(".polaroid-card"));
        const total = cards.length;
        cards.forEach((card) => {
          const slot = Number(card.dataset.slot), id = Number(card.dataset.animeId);
          const pose = polaroidPose(slot, total, fanSpreadBias, scrollFanFactor);
          const isHovered = hoveredAnimeId === id;
          card.style.zIndex = isHovered ? "26" : String(pose.z);
          card.style.transition = animateCards ? "transform 420ms var(--ease), box-shadow 240ms ease, border-color 240ms ease" : "none";
          card.classList.toggle("is-synced-hover", isHovered);
          // Rear cards emerge cleanly as fan opens
          card.style.opacity = slot === 0 ? "1" : String(Math.min(1, Math.max(0, (scrollFanFactor - 0.15) / 0.55)).toFixed(3));
          card.style.transform = `translate(-50%, -50%) translate3d(${pose.x.toFixed(1)}px, ${(pose.y + (isHovered ? -14 : 0)).toFixed(1)}px, 0) rotate(${pose.angle.toFixed(2)}deg) scale(${(pose.scale * (isHovered ? 1.055 : 1)).toFixed(3)})`;
        });
        contactList.querySelectorAll(".contact-sheet-btn").forEach((btn) => btn.classList.toggle("is-synced-hover", Number(btn.dataset.animeId) === hoveredAnimeId));
      }

      function renderPolaroidDeck(direction = 0) {
        const m = getMonthObj(activeMonthKey);
        polaroidDeck.innerHTML = "";
        if (!m.entries.length) {
          const empty = document.createElement("div"); empty.className = "polaroid-empty-card";
          empty.innerHTML = `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg><strong>留白的一页</strong><span>${m.key.replace("-", ".")} 暂无新增观看记录</span>`;
          polaroidDeck.appendChild(empty);
          return;
        }
        const len = m.entries.length;
        m.entries.map((_, i) => m.entries[(i + frontOrderOffset) % len]).forEach((entry, slot) => {
          const fig = document.createElement("figure"); fig.className = "polaroid-card";
          fig.dataset.slot = String(slot); fig.dataset.animeId = String(entry.id);
          fig.innerHTML = `<div class="polaroid-card-img"><img src="${largeSrc(entry)}" alt="${escapeHtml(entry.nameCn || entry.name)}" draggable="false" /></div><figcaption><span class="polaroid-card-title">${escapeHtml(entry.nameCn || entry.name)}</span><span class="polaroid-card-score">${entry.userScore ? "★" + entry.userScore.toFixed(1) : "—"}</span></figcaption>`;
          fig.addEventListener("pointerenter", () => { hoveredAnimeId = entry.id; applyPolaroidPositions(true); });
          fig.addEventListener("pointerleave", () => { if (hoveredAnimeId === entry.id) hoveredAnimeId = null; applyPolaroidPositions(true); });
          fig.addEventListener("click", (e) => {
            e.stopPropagation();
            if (slot !== 0) { frontOrderOffset = (frontOrderOffset + slot) % len; renderPolaroidDeck(0); return; }
            if (!jumpToReviewSubject(entry.id)) window.open(entry.url, "_blank", "noopener,noreferrer");
          });
          polaroidDeck.appendChild(fig);
        });
        applyPolaroidPositions(false);
        if (direction !== 0 && !reducedMotion.matches) {
          Array.from(polaroidDeck.querySelectorAll(".polaroid-card")).forEach((card, i) => {
            const dest = card.style.transform;
            card.animate([
              { opacity: 0, transform: `translate(-50%, -50%) translate3d(${direction * 38}px, 24px, 0) rotate(${direction * 8}deg) scale(0.9)` },
              { opacity: 1, transform: dest },
            ], { duration: 420, delay: i * 42, easing: "cubic-bezier(0.22, 1, 0.36, 1)", fill: "backwards" });
          });
        }
      }

      function animateOdometerDigit(slotEl, newChar, direction) {
        const oldEl = slotEl.querySelector(".odo-digit");
        if (oldEl && oldEl.textContent === newChar) return;
        const fresh = document.createElement("span"); fresh.className = "odo-digit"; fresh.textContent = newChar;
        slotEl.innerHTML = ""; slotEl.appendChild(fresh);
        if (!reducedMotion.matches && direction && oldEl) {
          fresh.animate([{ transform: `translateY(${direction > 0 ? "100%" : "-100%"})`, opacity: 0.2 }, { transform: "translateY(0%)", opacity: 1 }], { duration: 340, easing: "cubic-bezier(0.22, 1, 0.36, 1)" });
        }
      }

      function renderTimelineDetails(direction = 0) {
        const m = getMonthObj(activeMonthKey);
        const mmStr = String(m.monthNum).padStart(2, "0");
        animateOdometerDigit(odoTens, mmStr[0], direction);
        animateOdometerDigit(odoOnes, mmStr[1], direction);
        tlYearLabel.textContent = String(m.year); sleeveYear.textContent = String(m.year);
        if (m.entries.length) {
          tlCountLine.innerHTML = `收录 <strong>${m.entries.length}</strong> 部动画`;
          contactList.hidden = false; contactList.innerHTML = "";
          m.entries.forEach((entry) => {
            const li = document.createElement("li"); li.className = "contact-sheet-item";
            const rev = reviewById.get(entry.id);
            li.innerHTML = `<button class="contact-sheet-btn" type="button" data-anime-id="${entry.id}"><img src="${thumbSrc(entry)}" alt="" loading="lazy" /><span class="contact-sheet-text"><strong>${escapeHtml(entry.nameCn || entry.name)}</strong><span>${fmtMonthDay(entry.updatedAt)} 记录</span></span><span class="contact-sheet-score ${entry.userScore ? "" : "is-none"}">${entry.userScore ? "★ " + entry.userScore.toFixed(1) : "未评分"}</span><span class="contact-sheet-action">${rev ? "短评 ↑" : "BGM ↗"}</span></button>`;
            const btn = li.querySelector("button");
            btn.addEventListener("pointerenter", () => { hoveredAnimeId = entry.id; applyPolaroidPositions(true); });
            btn.addEventListener("pointerleave", () => { if (hoveredAnimeId === entry.id) hoveredAnimeId = null; applyPolaroidPositions(true); });
            btn.addEventListener("click", () => { if (!jumpToReviewSubject(entry.id)) window.open(entry.url, "_blank", "noopener,noreferrer"); });
            contactList.appendChild(li);
          });
        } else { tlCountLine.innerHTML = `暂无观看记录`; contactList.hidden = true; }
      }

      function catmullRomPath(pts) {
        if (!pts.length) return "";
        if (pts.length === 1) return `M ${pts[0].x} ${pts[0].y}`;
        let d = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
        for (let i = 0; i < pts.length - 1; i++) {
          const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
          d += ` C ${(p1.x + (p2.x - p0.x) / 6).toFixed(1)} ${Math.min(pts[0].baseY, Math.max(8, p1.y + (p2.y - p0.y) / 6)).toFixed(1)}, ${(p2.x - (p3.x - p1.x) / 6).toFixed(1)} ${Math.min(pts[0].baseY, Math.max(8, p2.y - (p3.y - p1.y) / 6)).toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
        }
        return d;
      }

      let rulerMetrics = [], loupeCurrX = 0, loupeTargetX = 0, loupeVisible = false, rulerRaf = 0, rulerCurveEl = null, rulerAreaEl = null;
      function renderRuler() {
        visibleMonths = tlRange === "12" ? months.slice(-12) : tlRange === "24" ? months.slice(-24) : months.slice();
        if (!visibleMonths.some((m) => m.key === activeMonthKey)) activeMonthKey = visibleMonths[visibleMonths.length - 1].key;
        rulerCaption.textContent = `${visibleMonths[0].key.replace("-", ".")} — ${visibleMonths[visibleMonths.length - 1].key.replace("-", ".")}`;
        const minColW = visibleMonths.length > 24 ? 46 : visibleMonths.length > 12 ? 52 : 66;
        const canvasW = Math.max(rulerScroll.clientWidth || 900, visibleMonths.length * minColW);
        rulerCanvas.style.width = `${canvasW}px`;
        const svgH = 112, padTop = 18, baseY = 98, maxCnt = Math.max(...visibleMonths.map((m) => m.entries.length), 1), colW = canvasW / visibleMonths.length;
        const pts = visibleMonths.map((m, i) => ({ x: (i + 0.5) * colW, y: baseY - (m.entries.length / maxCnt) * (baseY - padTop), baseY, month: m }));
        rulerMetrics = pts;
        const curveD = catmullRomPath(pts);
        const areaD = `${curveD} L ${pts[pts.length - 1].x.toFixed(1)} ${baseY} L ${pts[0].x.toFixed(1)} ${baseY} Z`;
        let yearLines = "";
        pts.forEach((p, i) => {
          if ((i === 0 && p.month.monthNum <= 11) || p.month.monthNum === 1) {
            const x = i * colW + (i === 0 ? 6 : 0);
            yearLines += `<line class="ruler-year-divider" x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="6" y2="${baseY}" /><text class="ruler-year-tag" x="${(x + 6).toFixed(1)}" y="16">${p.month.year}</text>`;
          }
        });
        rulerSvg.setAttribute("viewBox", `0 0 ${canvasW} ${svgH}`);
        rulerSvg.innerHTML = `<line class="ruler-grid" x1="0" x2="${canvasW}" y1="${baseY}" y2="${baseY}" /><line class="ruler-grid" x1="0" x2="${canvasW}" y1="${(baseY + padTop) * 0.5}" y2="${(baseY + padTop) * 0.5}" />${yearLines}<path class="ruler-area" id="ruler-area-path" d="${areaD}" /><path class="ruler-curve" id="ruler-curve-path" d="${curveD}" />`;
        rulerCurveEl = document.getElementById("ruler-curve-path"); rulerAreaEl = document.getElementById("ruler-area-path");
        rulerCols.style.gridTemplateColumns = `repeat(${visibleMonths.length}, minmax(0, 1fr))`;
        rulerCols.innerHTML = "";
        pts.forEach((p) => {
          const m = p.month;
          const colBtn = document.createElement("button");
          colBtn.type = "button"; colBtn.className = "ruler-col"; colBtn.dataset.monthKey = m.key;
          colBtn.setAttribute("aria-pressed", String(m.key === activeMonthKey));
          colBtn.setAttribute("aria-label", `${m.year}年${m.monthNum}月：${m.entries.length}部动画`);
          colBtn.innerHTML = `<span class="ruler-dot ${m.entries.length === 0 ? "is-zero" : ""}" style="bottom:${(146 - p.y - 4.5).toFixed(1)}px"></span><span class="ruler-col-label">${m.shortLabel}</span>`;
          colBtn.addEventListener("click", () => selectTimelineMonth(m.key));
          rulerCols.appendChild(colBtn);
        });
      }

      function selectTimelineMonth(key) {
        if (key === activeMonthKey) return;
        const direction = months.findIndex((m) => m.key === key) >= months.findIndex((m) => m.key === activeMonthKey) ? 1 : -1;
        activeMonthKey = key; frontOrderOffset = 0; hoveredAnimeId = null;
        rulerCols.querySelectorAll(".ruler-col").forEach((col) => col.setAttribute("aria-pressed", String(col.dataset.monthKey === activeMonthKey)));
        renderPolaroidDeck(direction); renderTimelineDetails(direction);
        measureMorphAnchors();
      }

      function setTimelineRange(rangeVal) {
        tlRange = rangeVal;
        rangeButtons.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.range === rangeVal)));
        positionThumb(document.getElementById("tl-range-group"), rangeThumb, rangeButtons.find((b) => b.dataset.range === rangeVal));
        renderRuler();
        const activeCol = rulerCols.querySelector(`[data-month-key="${activeMonthKey}"]`);
        if (activeCol) rulerScroll.scrollLeft = Math.max(0, activeCol.offsetLeft - rulerScroll.clientWidth / 2 + activeCol.clientWidth / 2);
        updateHandoff();
      }

      function updateMagneticRuler() {
        const cols = Array.from(rulerCols.querySelectorAll(".ruler-col"));
        if (!loupeVisible) { cols.forEach((c) => { c.style.setProperty("--mag-y", "0px"); c.style.setProperty("--mag-scale", "1"); c.style.setProperty("--label-y", "0px"); }); rulerRaf = 0; return; }
        loupeCurrX += (loupeTargetX - loupeCurrX) * 0.28;
        rulerLoupe.style.left = `${loupeCurrX.toFixed(1)}px`; rulerLoupeLine.style.left = `${loupeCurrX.toFixed(1)}px`;
        let closest = rulerMetrics[0], minDist = Infinity;
        rulerMetrics.forEach((pt, idx) => {
          const dist = Math.abs(loupeCurrX - pt.x);
          if (dist < minDist) { minDist = dist; closest = pt; }
          const factor = Math.exp(-(dist * dist) / (2 * 68 * 68));
          const col = cols[idx];
          if (col) { col.style.setProperty("--mag-y", `${(-9 * factor).toFixed(1)}px`); col.style.setProperty("--mag-scale", `${(1 + 0.32 * factor).toFixed(3)}`); col.style.setProperty("--label-y", `${(-2 * factor).toFixed(1)}px`); }
        });
        if (closest) rulerLoupe.textContent = `${closest.month.key.replace("-", ".")} · ${closest.month.entries.length}部`;
        if (Math.abs(loupeTargetX - loupeCurrX) > 0.4) rulerRaf = requestAnimationFrame(updateMagneticRuler);
        else rulerRaf = 0;
      }

      let isScrubbingRuler = false;
      function monthKeyAtClientX(clientX) {
        const rect = rulerCanvas.getBoundingClientRect();
        const x = Math.max(0, Math.min(rect.width, clientX - rect.left));
        let closest = rulerMetrics[0], minD = Infinity;
        for (const p of rulerMetrics) { const d = Math.abs(x - p.x); if (d < minD) { minD = d; closest = p; } }
        return { x, key: closest?.month.key };
      }
      rulerCanvas.addEventListener("pointermove", (e) => {
        const { x, key } = monthKeyAtClientX(e.clientX);
        loupeTargetX = x;
        if (!loupeVisible) { loupeCurrX = x; loupeVisible = true; rulerLoupe.classList.add("is-visible"); rulerLoupeLine.classList.add("is-visible"); }
        if (isScrubbingRuler && key) selectTimelineMonth(key);
        if (!rulerRaf && !reducedMotion.matches) rulerRaf = requestAnimationFrame(updateMagneticRuler);
      });
      rulerCanvas.addEventListener("pointerleave", () => { if (isScrubbingRuler) return; loupeVisible = false; rulerLoupe.classList.remove("is-visible"); rulerLoupeLine.classList.remove("is-visible"); updateMagneticRuler(); });
      rulerCanvas.addEventListener("pointerdown", (e) => { isScrubbingRuler = true; rulerCanvas.setPointerCapture(e.pointerId); const { x, key } = monthKeyAtClientX(e.clientX); loupeTargetX = x; loupeCurrX = x; if (key) selectTimelineMonth(key); });
      rulerCanvas.addEventListener("pointerup", () => { isScrubbingRuler = false; });
      rulerCanvas.addEventListener("pointercancel", () => { isScrubbingRuler = false; });

      polaroidStage.addEventListener("pointermove", (e) => { if (reducedMotion.matches) return; const rect = polaroidStage.getBoundingClientRect(); fanSpreadBias = ((e.clientX - rect.left) / rect.width - 0.5) * 2; applyPolaroidPositions(true); });
      polaroidStage.addEventListener("pointerleave", () => { fanSpreadBias = 0; applyPolaroidPositions(true); });
      polaroidStage.addEventListener("pointerdown", (e) => {
        if (e.target.closest(".polaroid-card")) return;
        const startX = e.clientX; polaroidStage.classList.add("is-scrubbing");
        const onUp = (ev) => {
          polaroidStage.removeEventListener("pointerup", onUp); polaroidStage.classList.remove("is-scrubbing");
          const dx = ev.clientX - startX;
          if (Math.abs(dx) > 48) { const idx = visibleMonths.findIndex((m) => m.key === activeMonthKey); selectTimelineMonth(visibleMonths[Math.max(0, Math.min(visibleMonths.length - 1, idx + (dx < 0 ? 1 : -1)))].key); }
        };
        polaroidStage.addEventListener("pointerup", onUp);
      });
      rangeButtons.forEach((b) => b.addEventListener("click", () => setTimelineRange(b.dataset.range)));

      /* ===================================================================
         PLAN C CHOREOGRAPHY: PIXEL-EXACT CIRCULAR PLATE & POSTER CONTINUOUS MORPH
      =================================================================== */
      const proxyPlate = document.getElementById("morph-proxy-plate");
      const proxyCard = document.getElementById("morph-proxy-card");
      const proxyImg = document.getElementById("morph-proxy-img");
      const proxyTitle = document.getElementById("morph-proxy-title");
      const proxyScore = document.getElementById("morph-proxy-score");
      const navRevLink = document.getElementById("nav-reviews");
      const navTlLink = document.getElementById("nav-timeline");

      let anchors = null;
      let handoffRaf = 0;
      const clamp01 = (v) => Math.max(0, Math.min(1, v));
      const lerp = (a, b, t) => a + (b - a) * t;
      const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
      const easeInOutCubic = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

      function syncProxyImage() {
        const item = filteredReviews[activeReviewIndex];
        if (!item) return;
        proxyImg.src = largeSrc(item);
        proxyTitle.textContent = item.nameCn || item.name || "";
        proxyScore.textContent = item.userScore ? "★" + item.userScore.toFixed(1) : "—";
      }

      function measureMorphAnchors() {
        if (!desktopHandoffQuery.matches) { anchors = null; return; }
        const pinRect = stagePin.getBoundingClientRect();
        const pA = reviewPlate.getBoundingClientRect();
        const pB = polaroidRing.getBoundingClientRect();
        const cA = deckOrbit.getBoundingClientRect();

        // Measure the exact front Polaroid center/size matching slot=0 pose (scale 1.02)
        const frontPol = polaroidDeck.querySelector(".polaroid-card[data-slot='0']") || polaroidDeck.querySelector(".polaroid-empty-card");
        const stageRect = polaroidStage.getBoundingClientRect();
        const baseW = frontPol ? frontPol.offsetWidth : 210;
        const baseH = frontPol ? frontPol.offsetHeight : 300;
        const cB = {
          cx: stageRect.left - pinRect.left + stageRect.width * 0.5,
          cy: stageRect.top - pinRect.top + stageRect.height * 0.43 + 1.5,
          w: baseW * 1.02,
          h: baseH * 1.02,
        };

        anchors = {
          plateA: { cx: pA.left - pinRect.left + pA.width / 2, cy: pA.top - pinRect.top + pA.height / 2, size: pA.width },
          plateB: { cx: pB.left - pinRect.left + pB.width / 2, cy: pB.top - pinRect.top + pB.height / 2, size: pB.width },
          cardA: { cx: cA.left - pinRect.left + cA.width / 2, cy: cA.top - pinRect.top + cA.height / 2, w: cA.width, h: cA.height },
          cardB: cB,
        };
      }

      function mixColorRgb(a, b, t) {
        return `rgb(${Math.round(lerp(a[0], b[0], t))}, ${Math.round(lerp(a[1], b[1], t))}, ${Math.round(lerp(a[2], b[2], t))})`;
      }

      function updateHandoff() {
        handoffRaf = 0;
        const vh = window.innerHeight || 900;
        const headerH = 56;
        const stickyH = vh - headerH;

        if (reducedMotion.matches || !desktopHandoffQuery.matches) {
          stagePin.style.removeProperty("--morph-bg");
          reviewsTop.style.transform = ""; reviewsTop.style.opacity = "";
          folioCopy.style.transform = ""; folioCopy.style.opacity = "";
          deckBar.style.opacity = "";
          deckOrbit.style.opacity = "";
          reviewPlate.style.opacity = "";
          proxyPlate.style.opacity = "0"; proxyCard.style.opacity = "0";
          tlSection.style.opacity = "1"; tlSection.style.pointerEvents = "auto"; tlSection.inert = false;
          timelineTop.style.transform = ""; timelineTop.style.opacity = "";
          timelineCopy.style.transform = ""; timelineCopy.style.opacity = "";
          polaroidRing.style.opacity = "1";
          polaroidSleeve.style.opacity = "1"; polaroidSleeve.style.transform = "";
          rulerInstrument.style.transform = ""; rulerInstrument.style.opacity = "";
          revSection.inert = false;
          polaroidDeck.style.opacity = "";
          if (rulerCurveEl) rulerCurveEl.style.clipPath = "";
          if (rulerAreaEl) rulerAreaEl.style.opacity = "";
          deckGatherProgress = 0; applyCardTransforms(false);
          scrollFanFactor = 1; applyPolaroidPositions(false);
          const inTimeline = tlSection.getBoundingClientRect().top <= headerH + stickyH * 0.45;
          navRevLink.classList.toggle("is-current", !inTimeline);
          navTlLink.classList.toggle("is-current", inTimeline);
          return;
        }

        if (!anchors) measureMorphAnchors();
        const trackRect = reviewsTrack.getBoundingClientRect();
        const travel = Math.max(1, reviewsTrack.offsetHeight - stickyH);
        const p = clamp01((headerH - trackRect.top) / travel);

        navRevLink.classList.toggle("is-current", p < 0.55);
        navTlLink.classList.toggle("is-current", p >= 0.55);

        // Flat solid background interpolation: #f2f3ed -> #eaf0eb
        stagePin.style.setProperty("--morph-bg", clamp01((p - 0.12) / 0.56).toFixed(4));

        // 1. Outgoing Reviews copy & rear cards tuck cleanly behind the front card (0 -> 0.36)
        const clearP = easeOutCubic(clamp01(p / 0.36));
        reviewsTop.style.transform = `translateY(${(-clearP * 26).toFixed(1)}px)`;
        reviewsTop.style.opacity = String((1 - clearP).toFixed(3));
        folioCopy.style.transform = `translateY(${(-clearP * 34).toFixed(1)}px)`;
        folioCopy.style.opacity = String((1 - clearP).toFixed(3));
        deckBar.style.opacity = String(Math.max(0, 1 - clearP * 1.4).toFixed(3));
        revSection.inert = p > 0.05;

        const nextGather = clamp01(p / 0.22);
        if (Math.abs(nextGather - deckGatherProgress) > 0.005 || nextGather === 0 || nextGather === 1) {
          deckGatherProgress = nextGather;
          applyCardTransforms(false);
        }

        // 2. Spatial Proxy Plate & Card active window (p: 0.015 -> 0.80) with sculptural arc + caption reveal
        const morphT = easeInOutCubic(clamp01((p - 0.10) / 0.58));
        const proxyActive = p > 0.015 && p < 0.80 && anchors;

        if (proxyActive) {
          reviewPlate.style.opacity = "0";
          deckOrbit.style.opacity = p < 0.07 ? String(1 - (p - 0.015) / 0.055) : "0";
          polaroidRing.style.opacity = "0";

          const arcSin = Math.sin(morphT * Math.PI);
          // Interpolate Circular Plate from plateA -> plateB with gentle mid-flight expansion & drift
          const pSize = lerp(anchors.plateA.size, anchors.plateB.size, morphT) * (1 + arcSin * 0.09);
          const pCx = lerp(anchors.plateA.cx, anchors.plateB.cx, morphT) + arcSin * 36;
          const pCy = lerp(anchors.plateA.cy, anchors.plateB.cy, morphT) - arcSin * 12;
          proxyPlate.style.opacity = "1";
          proxyPlate.style.width = `${pSize.toFixed(1)}px`;
          proxyPlate.style.height = `${pSize.toFixed(1)}px`;
          proxyPlate.style.left = `${(pCx - pSize / 2).toFixed(1)}px`;
          proxyPlate.style.top = `${(pCy - pSize / 2).toFixed(1)}px`;
          proxyPlate.style.background = mixColorRgb([233, 237, 229], [221, 232, 220], morphT);
          proxyPlate.style.borderColor = mixColorRgb([220, 227, 216], [211, 224, 211], morphT);

          // Interpolate Poster Card along a gentle S-arc from cardA -> cardB with physical 3D tilt & caption reveal
          const cCx = lerp(anchors.cardA.cx, anchors.cardB.cx, morphT) + arcSin * 62;
          const cCy = lerp(anchors.cardA.cy, anchors.cardB.cy, morphT) - arcSin * 28;
          const cW = lerp(anchors.cardA.w, anchors.cardB.w, morphT);
          const cH = lerp(anchors.cardA.h, anchors.cardB.h, morphT);
          const pad = lerp(10, 8, morphT);
          const capProg = clamp01((morphT - 0.36) / 0.50);
          const rotZ = lerp(0, -2, morphT) - arcSin * 5.2;
          const rotY = -arcSin * 17;
          const handoffFade = p > 0.66 ? 1 - clamp01((p - 0.66) / 0.14) : 1;

          proxyCard.style.opacity = String(handoffFade.toFixed(3));
          proxyCard.style.width = `${cW.toFixed(1)}px`;
          proxyCard.style.height = `${cH.toFixed(1)}px`;
          proxyCard.style.left = `${(cCx - cW / 2).toFixed(1)}px`;
          proxyCard.style.top = `${(cCy - cH / 2).toFixed(1)}px`;
          proxyCard.style.padding = `${pad.toFixed(1)}px ${pad.toFixed(1)}px ${lerp(10, 0, capProg).toFixed(1)}px`;
          proxyCard.style.borderRadius = `${lerp(10, 5, morphT).toFixed(1)}px`;
          proxyCard.style.setProperty("--cap-h", `${(capProg * 33).toFixed(1)}px`);
          proxyCard.style.setProperty("--cap-op", capProg.toFixed(3));
          proxyCard.style.transform = `perspective(1200px) rotateY(${rotY.toFixed(2)}deg) rotateZ(${rotZ.toFixed(2)}deg)`;
        } else {
          proxyPlate.style.opacity = "0";
          proxyCard.style.opacity = "0";
          reviewPlate.style.opacity = p <= 0.015 ? "1" : "0";
          deckOrbit.style.opacity = p <= 0.015 ? "1" : "0";
          polaroidRing.style.opacity = p >= 0.80 ? "1" : "0";
        }

        // 3. Overlapping Right-Column & Timeline Rhythm entrance (eliminates mid-transition void!)
        const rightIn = easeOutCubic(clamp01((p - 0.20) / 0.46));
        const deckIn = clamp01((p - 0.64) / 0.16);
        const sleeveIn = easeOutCubic(clamp01((p - 0.44) / 0.30));

        if (rightIn <= 0) {
          tlSection.style.opacity = "0"; tlSection.style.pointerEvents = "none"; tlSection.inert = true;
        } else {
          tlSection.style.opacity = "1";
          tlSection.style.pointerEvents = p > 0.86 ? "auto" : "none";
          tlSection.inert = p <= 0.86;

          polaroidDeck.style.opacity = String(deckIn.toFixed(3));
          polaroidSleeve.style.opacity = String(sleeveIn.toFixed(3));
          polaroidSleeve.style.transform = `translateX(-50%) translateY(${((1 - sleeveIn) * 20).toFixed(1)}px) rotate(-1.5deg)`;

          scrollFanFactor = easeOutCubic(clamp01((p - 0.66) / 0.28));
          applyPolaroidPositions(false);

          timelineTop.style.opacity = String(rightIn.toFixed(3));
          timelineTop.style.transform = `translateY(${((1 - rightIn) * 22).toFixed(1)}px)`;
          timelineCopy.style.opacity = String(rightIn.toFixed(3));
          timelineCopy.style.transform = `translateY(${((1 - rightIn) * 32).toFixed(1)}px)`;

          const rulerIn = easeOutCubic(clamp01((p - 0.26) / 0.48));
          rulerInstrument.style.opacity = String(Math.min(1, rulerIn * 1.4).toFixed(3));
          rulerInstrument.style.transform = `translateY(${((1 - rulerIn) * 18).toFixed(1)}px)`;
          if (rulerCurveEl) rulerCurveEl.style.clipPath = `inset(0 ${((1 - rulerIn) * 100).toFixed(1)}% 0 0)`;
          if (rulerAreaEl) rulerAreaEl.style.opacity = String(rulerIn.toFixed(3));
        }
      }

      window.addEventListener("scroll", () => { if (!handoffRaf) handoffRaf = requestAnimationFrame(updateHandoff); }, { passive: true });
      navRevLink.addEventListener("click", (e) => { e.preventDefault(); window.scrollTo({ top: 0, behavior: reducedMotion.matches ? "auto" : "smooth" }); });
      navTlLink.addEventListener("click", (e) => {
        e.preventDefault();
        if (!desktopHandoffQuery.matches || reducedMotion.matches) { tlSection.scrollIntoView({ behavior: reducedMotion.matches ? "auto" : "smooth" }); return; }
        window.scrollTo({ top: Math.max(0, reviewsTrack.offsetTop + reviewsTrack.offsetHeight - window.innerHeight), behavior: "smooth" });
      });

      function init() {
        applyReviewFilter("all");
        setTimelineRange("12");
        renderPolaroidDeck(0);
        renderTimelineDetails(0);
        syncProxyImage();
        measureMorphAnchors();
        updateHandoff();
        window.addEventListener("resize", () => {
          positionThumb(document.getElementById("review-filters"), filterThumb, filterButtons.find((b) => b.getAttribute("aria-pressed") === "true"));
          positionThumb(document.getElementById("tl-range-group"), rangeThumb, rangeButtons.find((b) => b.getAttribute("aria-pressed") === "true"));
          renderRuler(); measureMorphAnchors(); updateHandoff();
        });
        desktopHandoffQuery.addEventListener?.("change", () => { measureMorphAnchors(); updateHandoff(); });
        reducedMotion.addEventListener?.("change", () => { measureMorphAnchors(); updateHandoff(); });
      }
      init();
    })();
  </script>
</body>
</html>
